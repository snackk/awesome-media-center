x-common: &common
  restart: unless-stopped
  networks:
    - arr
  logging:
    options:
      max-size: "10m"
      max-file: "3"

x-lsio-env: &lsio-env
  PUID: ${PUID:?Set PUID in .env}
  PGID: ${PGID:?Set PGID in .env}
  TZ: ${TZ:?Set TZ in .env}

# Radarr, Sonarr, Prowlarr, Profilarr and Seerr join `web` and are published through Traefik
# at <name>.${DOMAIN}. Ports are also bound to 127.0.0.1 as an SSH-tunnel fallback.
# FlareSolverr stays internal (arr network only).
services:
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment: *lsio-env
    networks:
      - arr
      - web
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/radarr:/config
      # One mount for media + downloads => hardlinks / atomic moves
      - ${DATA_ROOT:?Set DATA_ROOT in .env}:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.radarr.entrypoints=https"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.radarr.middlewares=secure-headers@file"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    healthcheck:
      test: curl -fsS http://localhost:7878/ping || exit 1
      start_period: 30s
      timeout: 5s
      interval: 30s
      retries: 3

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment: *lsio-env
    networks:
      - arr
      - web
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/sonarr:/config
      - ${DATA_ROOT:?Set DATA_ROOT in .env}:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.sonarr.entrypoints=https"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.sonarr.middlewares=secure-headers@file"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    healthcheck:
      test: curl -fsS http://localhost:8989/ping || exit 1
      start_period: 30s
      timeout: 5s
      interval: 30s
      retries: 3

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment: *lsio-env
    networks:
      - arr
      - web
    ports:
      - "127.0.0.1:9696:9696"
    volumes:
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/prowlarr:/config
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.prowlarr.entrypoints=https"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.prowlarr.middlewares=secure-headers@file"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    healthcheck:
      test: curl -fsS http://localhost:9696/ping || exit 1
      start_period: 30s
      timeout: 5s
      interval: 30s
      retries: 3

  # Syncs quality profiles / custom formats to Radarr and Sonarr (http://radarr:7878, http://sonarr:8989).
  profilarr:
    <<: *common
    image: ghcr.io/dictionarry-hub/profilarr:latest
    container_name: profilarr
    environment:
      <<: *lsio-env
      UMASK: "022"
      # Required behind the reverse proxy
      ORIGIN: https://profilarr.${DOMAIN:?Set DOMAIN in .env}
    networks:
      - arr
      - web
    ports:
      - "127.0.0.1:6868:6868"
    volumes:
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/profilarr:/config
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.profilarr.entrypoints=https"
      - "traefik.http.routers.profilarr.rule=Host(`profilarr.${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.profilarr.middlewares=secure-headers@file"
      - "traefik.http.services.profilarr.loadbalancer.server.port=6868"
    depends_on:
      - radarr
      - sonarr

  # Internal only: used by Prowlarr (http://flaresolverr:8191).
  flaresolverr:
    <<: *common
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:?Set TZ in .env}

  # User-facing: needs `web` (Traefik, Emby) and `arr` (Radarr/Sonarr).
  seerr:
    <<: *common
    networks:
      - web
      - arr
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:?Set TZ in .env}
    volumes:
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/seerr:/app/config
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.seerr.entrypoints=https"
      - "traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.seerr.middlewares=secure-headers@file"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

networks:
  web:
    external: true
  # Shared with transmission and debrid so Radarr/Sonarr can reach the download clients.
  # Create once: docker network create arr
  arr:
    external: true

