# CrowdSec reads Traefik's access log and enforces nothing itself — enforcement
# is the bouncer plugin configured on the traefik service (traefik/docker-compose.yml).
# No "ports:" here on purpose: the LAPI (8080) is reached only by other containers on
# the "web" network via Docker DNS (http://crowdsec:8080), never published to the host.
services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    networks:
      - web
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      TZ: ${TZ:?Set TZ in .env}
    volumes:
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/crowdsec/config:/etc/crowdsec
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/crowdsec/data:/var/lib/crowdsec/data
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # Read-only, but still grants the container the ability to read every other
      # container's logs and inspect the Docker API (not just Traefik's) — the same
      # trade-off Portainer already makes with full socket access. acquis.yaml scopes
      # log *collection* to the traefik container only; this does not scope the socket
      # permission itself.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
