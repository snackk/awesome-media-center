services:
  rdt-client:
    image: rogerfar/rdtclient:latest
    container_name: debrid
    restart: unless-stopped
    ports:
      # Web UI: also published through Traefik at debrid.${DOMAIN}
      - "127.0.0.1:6500:6500"
    networks:
      - arr
      - web
    environment:
      - "PUID=${PUID:?Set PUID in .env}"
      - "PGID=${PGID:?Set PGID in .env}"
      - "TZ=${TZ:?Set TZ in .env}"
    volumes:
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/debrid:/data/db
      - ${DATA_ROOT:?Set DATA_ROOT in .env}/downloads:/data/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.debrid.entrypoints=https"
      - "traefik.http.routers.debrid.rule=Host(`debrid.${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.debrid.middlewares=secure-headers@file"
      - "traefik.http.services.debrid.loadbalancer.server.port=6500"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:6500/ || exit 1
      start_period: 20s
      timeout: 3s
      interval: 30s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
  arr:
    external: true
