services:
  rdt-client:
    image: rogerfar/rdtclient:latest
    container_name: debrid
    restart: unless-stopped
    ports:
      # Web UI: localhost only (SSH tunnel / Tailscale), not exposed through Traefik
      - "127.0.0.1:6500:6500"
    networks:
      - arr
    environment:
      - "PUID=${PUID:?Set PUID in .env}"
      - "PGID=${PGID:?Set PGID in .env}"
      - "TZ=${TZ:?Set TZ in .env}"
    volumes:
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/debrid:/data/db
      - ${DATA_ROOT:?Set DATA_ROOT in .env}/downloads:/data/downloads
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:6500/ || exit 1
      start_period: 20s
      timeout: 3s
      interval: 30s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  arr:
    external: true
