services:
  emby:
    image: emby/embyserver:latest
    container_name: emby
    restart: unless-stopped
    ports:
      # Direct LAN access for TVs/clients; everything else goes through Traefik
      - "8096:8096"
    networks:
      - web
    volumes:
      - ${CONFIG_ROOT:-/mnt/pool/config}/emby:/config
      - ${DATA_ROOT:-/mnt/pool}/media:/data/media
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-992}"
      - "${VIDEO_GID:-44}"
    environment:
      - "UID=${PUID:-1000}"
      - "GID=${PGID:-1000}"
      - "TZ=${TZ:-Europe/Lisbon}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.emby.entrypoints=https"
      - "traefik.http.routers.emby.rule=Host(`emby.${DOMAIN:-snackk-media.com}`)"
      - "traefik.http.routers.emby.middlewares=secure-headers@file"
      - "traefik.http.services.emby.loadbalancer.server.port=8096"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8096/System/Ping || exit 1
      start_period: 30s
      timeout: 3s
      interval: 30s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true

