services:
  jenkins:
    build: .
    image: snackk/jenkins
    container_name: jenkins
    restart: unless-stopped
    # Required for Docker-in-Docker builds; Jenkins effectively has root on the host.
    privileged: true
    networks:
      - web
    volumes:
      - ${CONFIG_ROOT:-/mnt/pool/config}/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.jenkins.entrypoints=https"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.${DOMAIN:-snackk-media.com}`)"
      - "traefik.http.routers.jenkins.middlewares=secure-headers@file"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true

