services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID:?Set PUID in .env}:${PGID:?Set PGID in .env}"
    networks:
      - web
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
      TZ: ${TZ:?Set TZ in .env}
    volumes:
      # Database, cache and playlists
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/navidrome:/data
      # Music library (read-only)
      - ${DATA_ROOT:?Set DATA_ROOT in .env}/music:/music:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.navidrome.entrypoints=https"
      - "traefik.http.routers.navidrome.rule=Host(`navidrome.${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.navidrome.middlewares=secure-headers@file"
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:4533/ping || exit 1
      start_period: 30s
      timeout: 3s
      interval: 30s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true

