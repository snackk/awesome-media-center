# Samba config for the NAS (Ubuntu host, not a container). Install with samba/README.md.
#
# One share, "media", exposing everything under /media/data EXCEPT the application configs
# (/media/data/configs holds API keys, databases and certificates).
# Reachable only from the home LAN and from your tailnet (hosts allow + firewall); the SMB port
# must never be forwarded on the router.

[global]
   workgroup = WORKGROUP
   server string = snackk-nas
   server role = standalone server

   # SMB over TCP only: no NetBIOS (nmbd is not needed)
   smb ports = 445
   disable netbios = yes

   # Only the loopback, the home LAN and the Tailscale range (CGNAT 100.64.0.0/10) may connect.
   # Listening on every interface (no "bind interfaces only") is deliberate: tailscale0 is created
   # by the tailscale container after smbd has started, so pinning interfaces would miss it.
   hosts allow = 127.0.0.1 192.168.1.0/24 100.64.0.0/10
   hosts deny = 0.0.0.0/0

   # Authentication: real users only, no guest access
   security = user
   map to guest = never
   restrict anonymous = 2

   # No old protocols
   server min protocol = SMB2_02

   # No printing
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # macOS / iOS friendly (Finder, Files app): metadata stored as xattrs instead of ._ files
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

   log file = /var/log/samba/log.%m
   max log size = 1000

[media]
   comment = Media (everything except configs)
   path = /media/data
   valid users = snackk
   browseable = yes
   read only = no
   # Files are owned by snackk (UID 1000), the same user the containers run as
   create mask = 0664
   directory mask = 0775
   hide dot files = yes
   # Hides AND blocks any entry with these exact names, at any depth of the share.
   # configs = application secrets; lost+found = ext4 housekeeping.
   veto files = /configs/lost+found/
   delete veto files = no
