http:
  middlewares:
    # Applied to every service via: traefik.http.routers.<name>.middlewares=secure-headers@file
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "same-origin"
    # Applied to every public router via: traefik.http.routers.<name>.middlewares=crowdsec@file
    # (first in the chain, see README). The "@file" suffix is required: a label-defined
    # router must name the provider a cross-provider middleware actually lives in, not
    # assume @docker. Defined here rather than as labels on the traefik service itself,
    # so that service never needs "traefik.enable=true" (see traefik/docker-compose.yml
    # for why that matters). crowdsecLapiKeyFile reads the bouncer key from a file
    # instead of a literal value, because this static file is not passed through
    # compose's ${VAR} substitution.
    crowdsec:
      plugin:
        bouncer:
          enabled: true
          crowdsecMode: live
          crowdsecLapiScheme: http
          crowdsecLapiHost: "crowdsec:8080"
          crowdsecLapiKeyFile: /run/secrets/crowdsec-bouncer-key


tls:
  options:
    default:
      minVersion: VersionTLS12
      # Abort the handshake when the client sends no SNI or an unknown one, so
      # scanners hitting the bare IP get no certificate and no 404 to fingerprint
      sniStrict: true

