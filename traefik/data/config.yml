http:
  middlewares:
    # Applied to every service via: traefik.http.routers.<name>.middlewares=secure-headers@file
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "same-origin"


tls:
  options:
    default:
      minVersion: VersionTLS12
      # Abort the handshake when the client sends no SNI or an unknown one, so
      # scanners hitting the bare IP get no certificate and no 404 to fingerprint
      sniStrict: true

