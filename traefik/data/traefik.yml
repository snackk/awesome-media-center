api:
  dashboard: true
  debug: false

ping: {}

log:
  level: INFO

entryPoints:
  http:
    address: ":80"
    http:
      # Global HTTP -> HTTPS redirect: services only need an https router
      redirections:
        entryPoint:
          to: https
          scheme: https
          permanent: true
  https:
    address: ":443"
    http:
      # TLS + certificate resolver for every router on this entrypoint
      tls:
        certResolver: ssl-cert

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: web
  file:
    filename: /config.yml

certificatesResolvers:
  ssl-cert:
    acme:
      email: snackk026@gmail.com
      storage: acme.json
      httpChallenge:
        entryPoint: http

