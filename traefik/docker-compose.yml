services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    networks:
      - web
    ports:
      - "80:80"
      - "443:443"
      # Dashboard/API: localhost only (SSH tunnel / Tailscale), never routed through Traefik
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data/traefik.yml:/traefik.yml:ro
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/traefik/acme.json:/acme.json
      - ./data/config.yml:/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      # Lets Traefik reach services running with network_mode: host (homecontrol)
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true

