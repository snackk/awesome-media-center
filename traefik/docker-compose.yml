services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    networks:
      - web
    ports:
      - "80:80"
      - "443:443"
      # Dashboard/API: localhost only (SSH tunnel / Tailscale), never routed through Traefik
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data/traefik.yml:/traefik.yml:ro
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/traefik/acme.json:/acme.json
      - ./data/config.yml:/config.yml:ro
      # Bouncer API key for the "crowdsec" middleware (config.yml), as a file rather
      # than an env var: config.yml is read by Traefik's file provider, which does no
      # ${VAR} substitution, so the key can't be interpolated into it at deploy time
      # the way compose labels can. Generated by `docker exec crowdsec cscli bouncers
      # add traefik-bouncer -o raw` AFTER the crowdsec container is up (see
      # crowdsec/docker-compose.yml) — write the printed value to this file, THEN
      # start/restart traefik.
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/traefik/crowdsec-bouncer-key:/run/secrets/crowdsec-bouncer-key:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      # Lets Traefik reach services running with network_mode: host (homecontrol)
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    # No "traefik.enable=true" / router labels here: the "crowdsec" middleware (used as
    # crowdsec@file -- note the @file suffix, it lives in the file provider, not
    # @docker -- from every public router's "middlewares" label) is defined in
    # config.yml instead, via the file provider. Labeling the traefik service itself
    # was tried first, but traefik.enable=true with no explicit router for this
    # container makes Traefik's Docker provider auto-create one per entrypoint from
    # defaultRule (Host(`traefik-traefik`)) — a dead router that only ever fails its
    # ACME order (that hostname has no dot) and serves no purpose.
    #
    # No `depends_on: crowdsec` either: crowdsec lives in its own compose project
    # (crowdsec/docker-compose.yml), and Compose only resolves depends_on within the
    # same file/project — naming a service from another project makes `docker compose
    # config` fail outright. The real ordering guarantee is the runbook: bring crowdsec
    # up and healthy FIRST, generate the bouncer key file, then start/restart traefik.

networks:
  web:
    external: true

