services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    networks:
      - web
    ports:
      - "80:80"
      - "443:443"
      # Dashboard/API: localhost only (SSH tunnel / Tailscale), never routed through Traefik
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data/traefik.yml:/traefik.yml:ro
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/traefik/acme.json:/acme.json
      - ./data/config.yml:/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      # Lets Traefik reach services running with network_mode: host (homecontrol)
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Defines the "crowdsec" middleware (referenced as crowdsec@docker from every
      # public router's "middlewares" label), the same way the other services define
      # their own Traefik labels. CROWDSEC_BOUNCER_KEY is generated by
      # `docker exec crowdsec cscli bouncers add traefik-bouncer -o raw` AFTER the
      # crowdsec container is up (see crowdsec/docker-compose.yml) — bring crowdsec up
      # first, set the key in .env, THEN start/restart traefik.
      - "traefik.enable=true"
      - "traefik.http.middlewares.crowdsec.plugin.bouncer.enabled=true"
      - "traefik.http.middlewares.crowdsec.plugin.bouncer.crowdsecMode=live"
      - "traefik.http.middlewares.crowdsec.plugin.bouncer.crowdsecLapiScheme=http"
      - "traefik.http.middlewares.crowdsec.plugin.bouncer.crowdsecLapiHost=crowdsec:8080"
      - "traefik.http.middlewares.crowdsec.plugin.bouncer.crowdsecLapiKey=${CROWDSEC_BOUNCER_KEY:?Set CROWDSEC_BOUNCER_KEY in .env (see crowdsec/docker-compose.yml) after crowdsec is up}"
    # No `depends_on: crowdsec` here: crowdsec lives in its own compose project
    # (crowdsec/docker-compose.yml), and Compose only resolves depends_on within the
    # same file/project — naming a service from another project makes `docker compose
    # config` fail outright. The real ordering guarantee is the runbook: bring crowdsec
    # up and healthy FIRST, generate CROWDSEC_BOUNCER_KEY, then start/restart traefik.

networks:
  web:
    external: true

