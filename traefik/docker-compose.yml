services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    networks:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/traefik.yml:/traefik.yml:ro
      - ./data/acme.json:/acme.json
      - ./data/config.yml:/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      # Lets Traefik reach services running with network_mode: host (homecontrol)
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.traefik.entrypoints=https"
      - "traefik.http.routers.traefik.rule=Host(`dashboard.${DOMAIN:-snackk-media.com}`)"
      - "traefik.http.routers.traefik.service=api@internal"
      # Dashboard is protected by basic auth (generate with htpasswd, escape $ as $$)
      - "traefik.http.middlewares.traefik-auth.basicauth.users=snackk:$$apr1$$4rzTfR6u$$1KWcbCpqRVMoszfZv2.XV/"
      - "traefik.http.routers.traefik.middlewares=traefik-auth,secure-headers@file"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true

