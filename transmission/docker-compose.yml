services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    ports:
      # BitTorrent peer port must be reachable from the Internet (forward it on the router)
      - "51413:51413"
      - "51413:51413/udp"
    networks:
      - web
      - arr
    volumes:
      - ${CONFIG_ROOT:-/mnt/pool/config}/transmission:/config
      - ${DATA_ROOT:-/mnt/pool}/downloads:/downloads
    environment:
      - "PUID=${PUID:-1000}"
      - "PGID=${PGID:-1000}"
      - "TZ=${TZ:-Europe/Lisbon}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.transmission.entrypoints=https"
      - "traefik.http.routers.transmission.rule=Host(`transmission.${DOMAIN:-snackk-media.com}`)"
      - "traefik.http.routers.transmission.middlewares=secure-headers@file"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
  arr:
    external: true
