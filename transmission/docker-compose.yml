services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    ports:
      # BitTorrent peer port must be reachable from the Internet (forward it on the router)
      - "51413:51413"
      - "51413:51413/udp"
      # Web UI: also published through Traefik at transmission.${DOMAIN}
      - "127.0.0.1:9091:9091"
    networks:
      - arr
      - web
    volumes:
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/transmission:/config
      - ${DATA_ROOT:?Set DATA_ROOT in .env}/downloads:/downloads
    environment:
      - "PUID=${PUID:?Set PUID in .env}"
      - "PGID=${PGID:?Set PGID in .env}"
      - "TZ=${TZ:?Set TZ in .env}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.transmission.entrypoints=https"
      - "traefik.http.routers.transmission.rule=Host(`transmission.${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.transmission.middlewares=secure-headers@file"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
  arr:
    external: true
