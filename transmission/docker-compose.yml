services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    ports:
      # BitTorrent peer port must be reachable from the Internet (forward it on the router)
      - "51413:51413"
      - "51413:51413/udp"
      # Web UI: localhost only (SSH tunnel / Tailscale), not exposed through Traefik
      - "127.0.0.1:9091:9091"
    networks:
      - arr
    volumes:
      - ${CONFIG_ROOT:?Set CONFIG_ROOT in .env}/transmission:/config
      - ${DATA_ROOT:?Set DATA_ROOT in .env}/downloads:/downloads
    environment:
      - "PUID=${PUID:?Set PUID in .env}"
      - "PGID=${PGID:?Set PGID in .env}"
      - "TZ=${TZ:?Set TZ in .env}"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  arr:
    external: true
